[project]
name = "runbookfx-demo"
version = "0.1.0"
description = "Toy demo of type- and effect-checked LLM runbook synthesis (companion to the RunbookFX paper)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["runbookfx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
